<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>途中画册</title>
  <link rel="stylesheet" href="gallery.css">
  <script src="artworks.js" defer></script>
  <script src="gallery.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <p class="masthead-title">
        <svg class="masthead-wordmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 84" fill="none" role="img" aria-labelledby="gallery-wordmark-title">
          <title id="gallery-wordmark-title">途中画册</title>
          <g stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <g aria-hidden="true">
              <!-- 途: a seal-inspired composition of 辵 and 余. -->
              <path d="M14 8C13 13 10 17 5 20M15 24C14 29 10 34 5 37M15 41C15 46 12 51 7 55"/>
              <path d="M15 50V60C15 69 26 76 42 76H69M6 76C12 72 15 67 15 60"/>
              <path d="M25 27C34 23 42 16 46 8C50 16 57 22 67 27"/>
              <path d="M31 29H61M26 36C26 42 34 44 46 44C58 44 66 42 66 36M46 21V65C46 69 43 71 39 70"/>
              <path d="M35 48C35 55 31 61 25 65M57 48C57 55 60 61 66 65"/>
              <!-- 中: a vertical axis through a rounded enclosure. -->
              <path d="M113 8V76"/>
              <path d="M99 25H127C133 25 136 28 136 34V49C136 55 133 58 127 58H99C93 58 90 55 90 49V34C90 28 93 25 99 25Z"/>
              <!-- 畫: brush and hand above a bounded field. -->
              <path d="M189 8V47M169 17H198C204 17 207 20 207 25V32H171M169 25H211M169 40H207"/>
              <path d="M174 50H202C206 50 208 52 208 56V65C208 69 206 71 202 71H174C170 71 168 69 168 65V56C168 52 170 50 174 50Z"/>
              <path d="M188 50V71M168 60H208M160 51V68C160 74 164 78 170 78H206C212 78 216 74 216 68V51"/>
              <!-- 冊: bamboo slips bound by two horizontal cords. -->
              <path d="M246 18C248 31 248 50 245 68M261 8C262 28 262 57 259 77M277 8C276 28 276 57 279 77M292 18C290 31 290 50 293 68"/>
              <path d="M241 30H297M241 55H297"/>
            </g>
          </g>
        </svg>
      </p>
      <p class="masthead-note" data-i18n="tagline">在抵达之前，遇见一幅画。</p>
    </header>

    <main id="main" class="gallery" aria-labelledby="art-title" aria-busy="true">
      <figure class="artwork" aria-labelledby="art-title" aria-describedby="art-description">
        <div class="art-stage">
          <div class="art-mat"><img id="art-image" alt="" decoding="async"></div>
          <p id="image-fallback" class="image-fallback" hidden data-i18n="imageError">画作暂时未能载入，你仍可继续前往。</p>
        </div>
        <figcaption class="art-caption">
          <span><span class="caption-mark" aria-hidden="true"></span><span data-i18n="reinterpretation">名画的像素演绎</span></span>
          <span class="edition"><span id="edition-number">01</span><span class="edition-line" aria-hidden="true"></span><span id="edition-total">06</span></span>
        </figcaption>
      </figure>

      <section class="art-info">
        <p class="eyebrow"><span class="eyebrow-line" aria-hidden="true"></span><span data-i18n="encounter">此刻，与你相遇</span></p>
        <h1 id="art-title">途中画册</h1>
        <p class="artist-line"><span id="art-artist"></span><span class="metadata-dot" aria-hidden="true">·</span><span id="art-year"></span></p>
        <p id="art-description" class="art-description"></p>
        <dl class="art-details">
          <div><dt data-i18n="medium">原作媒介</dt><dd id="art-medium"></dd></div>
          <div><dt data-i18n="collection">原作馆藏</dt><dd id="art-collection"></dd></div>
        </dl>
        <p class="encounter-note"><span aria-hidden="true">↳</span><span data-i18n="oneAtATime">每次途经，偶遇一幅。</span></p>
      </section>
    </main>

    <footer class="departure" aria-label="跳转信息">
      <div class="departure-inner">
        <div class="destination">
          <span class="destination-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M10 13a5 5 0 0 0 7 .1l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7-.1l-3 3a5 5 0 0 0 7 7l1.7-1.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
          <div class="destination-copy">
            <p class="destination-label"><span data-i18n="destination">即将前往</span><span class="short-code">/art</span></p>
            <details class="destination-details">
              <summary><span id="destination-domain">www.dpm.org.cn</span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m5 6 3 3 3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr-only" data-i18n="fullAddress">查看完整目标地址</span></summary>
              <div class="url-popover"><span data-i18n="fullAddress">完整目标地址</span><p id="destination-url">https://www.dpm.org.cn/collection/paint.html</p></div>
            </details>
          </div>
        </div>
        <div class="departure-controls">
          <div class="countdown-state">
            <span class="timer-ring" aria-hidden="true"><svg viewBox="0 0 32 32"><circle class="ring-track" cx="16" cy="16" r="13"/><circle id="ring-progress" cx="16" cy="16" r="13"/></svg><span id="timer-number">2</span></span>
            <span id="timer-label">秒后自动跳转</span>
          </div>
          <button id="pause-button" class="pause-button" type="button" aria-pressed="false"><span id="pause-symbol" aria-hidden="true">Ⅱ</span><span id="pause-label">停留欣赏</span></button>
          <a id="continue-link" class="continue-link" href="destination.html"><span data-i18n="continue">立即前往</span><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </div>
      </div>
      <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
    </footer>
    <div id="status-message" class="sr-only" role="status" aria-live="polite"></div>
    <noscript><p class="noscript-note">此设计稿需启用 JavaScript 载入画册。<a href="destination.html">继续前往演示终点</a></p></noscript>
  </div>

  <aside id="review-tools" class="review-tools" aria-label="设计稿预览工具" hidden>
    <span class="review-label">设计预览</span>
    <button id="review-toggle" type="button" aria-expanded="false" aria-controls="review-panel">预览选项 <span aria-hidden="true">↗</span></button>
    <div id="review-panel" class="review-panel" hidden>
      <p>这是可交互的设计稿。预览默认暂停；到时会进入本地演示终点。</p>
      <label for="review-art">查看作品</label><select id="review-art"></select>
      <label for="review-seconds">模拟倒计时</label><select id="review-seconds"><option value="2">2 秒（当前默认）</option><option value="5">5 秒</option><option value="10">10 秒</option></select>
      <button id="review-restart" type="button">重新演示倒计时</button>
      <a id="review-language" href="?review=1&lang=en">English version ↗</a>
    </div>
  </aside>
</body>
</html>
